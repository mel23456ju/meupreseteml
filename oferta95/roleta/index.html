        <script>
            let attempt = 0; // Variável para contar as tentativas
            let isSpinning = false; // Debounce: prevent double-click on spin

            /* Progresso da roleta salvo no navegador (localStorage + cookie de reserva, 7 dias): quem volta
               não ganha giros novos. Grava no CLIQUE (recarregar no meio do giro não devolve o giro).
               usados: 1 = já caiu no "tente novamente"; 2 = já ganhou (mostra direto o prêmio). */
            const ROLETA_KEY = 'ml_roleta', ROLETA_TTL = 7 * 864e5;
            const lerRoleta = () => {
                let o = null;
                try { o = JSON.parse(localStorage.getItem(ROLETA_KEY) || 'null'); } catch (e) {}
                if (!o) {
                    const m = document.cookie.match(/(?:^|;\s*)ml_roleta=(\d)/);
                    if (m) o = { usados: +m[1], ts: Date.now() };
                }
                return o && (Date.now() - (o.ts || 0)) < ROLETA_TTL ? o : null;
            };
            const salvarRoleta = (usados) => {
                const o = { usados: usados, premio: usados >= 2 ? 95 : 0, ts: Date.now() };
                try { localStorage.setItem(ROLETA_KEY, JSON.stringify(o)); } catch (e) {}
                document.cookie = 'ml_roleta=' + usados + ';path=/;max-age=' + (ROLETA_TTL / 1000) + ';SameSite=Lax';
            };

            const animateSpin = () => {
                if (isSpinning) return; // Block while spinning
                const salvo = lerRoleta();
                if (salvo && salvo.usados >= 2) return; // já usou os 2 giros
                isSpinning = true;
                salvarRoleta(attempt + 1);
                const roleta2 = document.querySelector('#roleta2');
                const roleta2Img = document.querySelector('#roleta2 canvas');
                const buttonCta = document.getElementById('button-cta');
                const confettiAudio = document.getElementById('confetti-audio');
                const roletaAudio = document.getElementById('roleta-audio');

                if (roleta2) {
                    // Removendo a classe 'spinner' existente
                    roleta2Img.classList.remove('spinner');
                    buttonCta.style.visibility = 'hidden'; // Esconder o botão ao girar (sem pular o layout)
                    var girosTxt = document.getElementById('giros-txt'), bilhetes = document.querySelectorAll('#giros .bilhete');
                    if (bilhetes[attempt === 0 ? 1 : 0]) bilhetes[attempt === 0 ? 1 : 0].classList.add('usado');
                    girosTxt.innerHTML = attempt === 0 ? 'Você tem <b>1 giro</b>' : 'Boa sorte no <b>último giro</b>!';
                    roletaAudio.currentTime = 0;
                    roletaAudio.play().catch(() => {});

                    // Verificando a tentativa
                    if (attempt === 0) {
                        // Adicionando a nova classe de animação para simular a queda em "tente novamente"
                        const animatedClass = 'wheel__spinner_animated_retry_then_win';
                        roleta2.classList.add(animatedClass);

                        // Mostrar popup de "tente novamente" após a rotação
                        setTimeout(() => {
                            roletaAudio.pause();
                            roletaAudio.currentTime = 0;
                            // Mostrar o overlay e o popup de tente novamente
                            const overlay = document.getElementById('overlay');
                            const tryAgainPopup = document.getElementById('popup-try-again');
                            overlay.style.display = 'block';
                            tryAgainPopup.style.display = 'block';
                        }, 10000); // 10 segundos de rotação antes de mostrar o popup
                    } else {
                        // Adicionando a nova classe de animação para simular a queda no prêmio
                        const animatedClass = 'wheel__spinner_animated';
                        roleta2.classList.add(animatedClass);

                        // Mostrar popup de resgatar prêmio após a rotação
                        setTimeout(() => {
                            roletaAudio.pause();
                            roletaAudio.currentTime = 0;
                            // Executar a animação de confetes
                            confetti({
                              particleCount: 100,
                              spread: 70,
                              origin: { y: 0.6 }
                            });

                            // Reproduzir o áudio de confetes
                            confettiAudio.play().catch(() => {});

                            // Mostrar o overlay e o popup
                            const overlay = document.getElementById('overlay');
                            const popup = document.getElementById('popup');
                            overlay.style.display = 'block';
                            popup.style.display = 'block';

                            buttonCta.classList.add('hide-me');
                        }, 10000);
                    }
                }
                attempt++; // conta só o giro que de fato começou (clique duplo não pula tentativa)
            };

            const addSpinAnimation = (element) => {
                element.addEventListener('click', () => {
                    animateSpin();
                });
            };

            // Add event listener to all elements with the class .runSpin
            document.querySelectorAll('.runSpin').forEach(addSpinAnimation);

            document.getElementById('roleta3').addEventListener('click', () => {
                animateSpin();
            });

            document.getElementById('try-again-button').addEventListener('click', () => {
                // Ocultar o popup e o overlay
                const overlay = document.getElementById('overlay');
                const tryAgainPopup = document.getElementById('popup-try-again');
                overlay.style.display = 'none';
                tryAgainPopup.style.display = 'none';

                // Reiniciar a animação da roleta
                const roleta2 = document.querySelector('#roleta2');
                roleta2.classList.remove('wheel__spinner_animated_retry_then_win');

                // Mostrar o botão "GIRE PARA GANHAR" novamente
                const buttonCta = document.getElementById('button-cta');
                buttonCta.style.visibility = 'visible';
                buttonCta.textContent = 'GIRAR DE NOVO';

                // Allow spinning again
                isSpinning = false;
            });

            (() => {
                const descontos = [5, 10, 15, 20, 25, 30, 40, 50, 60, 75, 95];

                // fonte única: /assets/js/prova-social.js
                const pessoas = (window.PROVA_PESSOAS || []).map(p => ({ nome: p.nome, img: p.foto }));

                // Shuffle array for non-repeating sequence
                function shuffleArray(arr) {
                    var shuffled = arr.slice();
                    for (var i = shuffled.length - 1; i > 0; i--) {
                        var j = Math.floor(Math.random() * (i + 1));
                        var temp = shuffled[i];
                        shuffled[i] = shuffled[j];
                        shuffled[j] = temp;
                    }
                    return shuffled;
                }

                window.addEventListener('DOMContentLoaded', () => {
                    const contDiv = document.getElementById('people');
                    const peopleFrase = document.getElementById('people-p');
                    const peopleImg = document.querySelector('#people-img');

                    var queue = [];
                    var queueIndex = 0;

                    function getNextPerson() {
                        // When queue is exhausted, reshuffle
                        if (queueIndex >= queue.length) {
                            queue = shuffleArray(pessoas);
                            queueIndex = 0;
                        }
                        return queue[queueIndex++];
                    }

                    // Show first notification after 2 seconds
                    setTimeout(function showNext() {
                        var person = getNextPerson();
                        // Pick a FRESH random discount each time (not pre-baked)
                        var desconto = descontos[Math.floor(Math.random() * descontos.length)];

                        // Update content while hidden
                        var partes = person.nome.split(' ');
                        var curto = partes[0] + (partes[1] ? ' ' + partes[1].charAt(0) + '.' : '');
                        peopleFrase.innerHTML = '<b>' + curto + '</b> ganhou <b class="pct">' + desconto + '% de desconto</b><small>agora mesmo</small>';
                        peopleImg.src = person.img;

                        // Slide in
                        contDiv.classList.remove('display-off');
                        contDiv.classList.remove('slide-animation');
                        // Force reflow to restart animation
                        void contDiv.offsetWidth;
                        contDiv.classList.add('slide-animation');

                        // Hide after 3.5 seconds, then show next after pause
                        setTimeout(function() {
                            contDiv.classList.add('saindo');
                            setTimeout(function () { contDiv.classList.add('display-off'); contDiv.classList.remove('saindo', 'slide-animation'); }, 350);
                            // Random delay 3-6 seconds before next notification
                            var delay = 3000 + Math.floor(Math.random() * 3000);
                            setTimeout(showNext, delay);
                        }, 3500);
                    }, 2000);
                });
            })();

            // Função para obter todos os parâmetros da URL
            const getQueryParams = () => {
                const params = new URLSearchParams(window.location.search);
                return params.toString();
            };

            // Event listener for the resgatar button
            document.getElementById('resgatar-premio').addEventListener('click', () => {
                // Logic to redeem the prize
                const queryParams = getQueryParams();
                const baseUrl = '../recompensas/';
                const redirectUrl = queryParams ? `${baseUrl}?${queryParams}` : baseUrl;
                window.location.href = redirectUrl;
            });

            /* Voltou à roleta? Retoma de onde parou: 1 giro usado -> sobra 1; os 2 usados -> prêmio direto, sem girar. */
            (() => {
                const salvo = lerRoleta();
                if (!salvo || !salvo.usados) return;
                const bilhetes = document.querySelectorAll('#giros .bilhete');
                const girosTxt = document.getElementById('giros-txt');
                const buttonCta = document.getElementById('button-cta');
                if (salvo.usados >= 2) {
                    attempt = 2;
                    bilhetes.forEach((b) => b.classList.add('usado'));
                    girosTxt.innerHTML = 'Você já usou seus <b>2 giros</b>';
                    buttonCta.classList.add('hide-me');
                    document.getElementById('roleta3').disabled = true;
                    const popup = document.getElementById('popup');
                    popup.querySelector('h2').textContent = 'Seu prêmio está garantido!';
                    popup.querySelector('p').innerHTML = 'Você já ganhou <b>95% de desconto</b> na promoção de Natal e aniversário. É só resgatar!';
                    document.getElementById('overlay').style.display = 'block';
                    popup.style.display = 'block';
                } else {
                    attempt = 1;
                    if (bilhetes[1]) bilhetes[1].classList.add('usado');
                    girosTxt.innerHTML = 'Você tem <b>1 giro</b>';
                    buttonCta.textContent = 'GIRAR DE NOVO';
                }
            })();

        </script>
